name: Check source and portable instrument
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/check_repository.py
      - run: python3 build.py host
      - run: python3 tests/test_instrument.py build/host/baile.so
