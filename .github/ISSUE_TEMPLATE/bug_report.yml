name: Bug report
description: Report a reproducible BAILE problem
body:
  - type: markdown
    attributes:
      value: BAILE is experimental. Never include personal backups, account tokens, or device identifiers in an issue.
  - type: input
    id: version
    attributes:
      label: BAILE version or commit
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Where did it happen?
      options:
        - Browser preview
        - Native FWSC emulator
        - Physical FM-1
        - Build
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: Installation details, if relevant
      description: Previous firmware, updater/version and exact error shown on the physical FM-1. Do not infer it from the updater alone.
